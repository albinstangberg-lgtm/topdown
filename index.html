<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>topdown — twin-stick prototype</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8dae0;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #boot a { color: #7f8aa3; pointer-events: auto; }
      #boot a:hover { color: #cfd6e6; }
      #boot {
        position: fixed;
        inset: auto 0 16px 0;
        text-align: center;
        font-size: 12px;
        color: #6a7080;
        pointer-events: none;
        letter-spacing: 0.04em;
        /* Gets out of the way of the split-screen HUD once you have read it. */
        animation: fade-hint 1s ease-out 9s forwards;
      }
      @keyframes fade-hint {
        to { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">
      WASD move · mouse steers · click/space fire · shift dash · gamepad START to join ·
      C camera · F1 debug · [ ] change map · drop or paste a map to load it ·
      <a href="./editor.html">map editor</a>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
